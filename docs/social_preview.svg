<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="35%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Deep Ambient Glows -->
    <radialGradient id="emeraldRadial" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070b12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAccent" cx="88%" cy="75%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoAccent" cx="12%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="headingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glass Card Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glassCardHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="borderHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <!-- Modern Mesh Grid Pattern -->
    <pattern id="meshGrid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.22" />
      <circle cx="0" cy="0" r="1.2" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Shadow & Glow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#emeraldRadial)" />
  <rect width="1280" height="640" fill="url(#cyanAccent)" />
  <rect width="1280" height="640" fill="url(#indigoAccent)" />
  <rect width="1280" height="640" fill="url(#meshGrid)" />

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1278" height="638" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Subtle Accent Orbs -->
  <circle cx="240" cy="110" r="2.5" fill="#34d399" opacity="0.6" />
  <circle cx="1080" cy="140" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="180" cy="500" r="2.5" fill="#818cf8" opacity="0.5" />
  <circle cx="1120" cy="480" r="2.5" fill="#34d399" opacity="0.6" />

  <!-- Center Content Area -->
  <g transform="translate(640, 250)" text-anchor="middle">

    <!-- Top Badge Pill (Live / Zero-Fee Status) -->
    <g transform="translate(0, -110)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#0f172a" stroke="url(#borderHighlight)" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="-160" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="2">
        AUTONOMOUS PAYMENT GATEWAY
      </text>
    </g>

    <!-- Main Title -->
    <text y="-28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#headingGrad)" letter-spacing="-1.5">
      eSewa <tspan fill="url(#brandGrad)">Payment Gateway</tspan>
    </text>

    <!-- Modern Tagline -->
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
      Zero Transaction Fees • No Merchant PAN/VAT • Instant Payment Verification
    </text>

    <!-- Main Feature Highlights (4 Clean Glassmorphic Cards in 2x2 Grid) -->
    <g transform="translate(0, 95)">

      <!-- Card 1: 0% Fees -->
      <g transform="translate(-490, 0)">
        <rect x="0" y="0" width="230" height="84" rx="16" fill="url(#glassCardHighlight)" stroke="url(#borderHighlight)" stroke-width="1.2" filter="url(#cardShadow)" />
        <circle cx="38" cy="42" r="18" fill="#10b981" fill-opacity="0.15" />
        <text x="38" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#34d399" text-anchor="middle">0%</text>
        <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Zero Commission</text>
        <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Direct to your wallet</text>
      </g>

      <!-- Card 2: No PAN / VAT -->
      <g transform="translate(-240, 0)">
        <rect x="0" y="0" width="230" height="84" rx="16" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1" filter="url(#cardShadow)" />
        <circle cx="38" cy="42" r="18" fill="#06b6d4" fill-opacity="0.15" />
        <path d="M 38 31 L 47 35 L 47 43 C 47 48 38 53 38 53 C 38 53 29 48 29 43 L 29 35 Z" fill="none" stroke="#22d3ee" stroke-width="1.8" />
        <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">No Merchant PAN</text>
        <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Use personal eSewa</text>
      </g>

      <!-- Card 3: Instant Verification -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="230" height="84" rx="16" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1" filter="url(#cardShadow)" />
        <circle cx="38" cy="42" r="18" fill="#10b981" fill-opacity="0.15" />
        <path d="M 40 30 L 32 41 L 38 41 L 36 52 L 45 40 L 39 40 Z" fill="#34d399" />
        <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">Instant Verification</text>
        <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">Automated email sync</text>
      </g>

      <!-- Card 4: All Nepali Banks -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="230" height="84" rx="16" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1" filter="url(#cardShadow)" />
        <circle cx="38" cy="42" r="18" fill="#818cf8" fill-opacity="0.15" />
        <path d="M 29 35 L 38 30 L 47 35 M 31 36 L 31 48 M 38 36 L 38 48 M 45 36 L 45 48 M 28 50 L 48 50" fill="none" stroke="#a5b4fc" stroke-width="1.8" />
        <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="start">All Nepali Banks</text>
        <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start">eSewa &amp; 20+ Banks</text>
      </g>

    </g>

  </g>
</svg>
